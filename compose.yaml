services:
  aegis-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aegis-agent-mesh:latest
    container_name: aegis-agent-mesh-api
    ports:
      - "8080:8080"
    environment:
      - AEGIS_DB_PATH=/app/data/aegis_audit.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - aegis_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  aegis_data:
